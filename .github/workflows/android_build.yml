name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev python3-pip openjdk-17-jdk unzip libffi-dev libssl-dev git zip zlib1g-dev autoconf automake libtool pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: AirMouse-APK
          path: bin/*.apk
