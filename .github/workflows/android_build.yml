name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-dev python3-pip openjdk-17-jdk unzip libffi-dev libssl-dev git zip zlib1g-dev autoconf automake libtool pkg-config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > ~/.android/licenses/android-sdk-license
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > ~/.android/licenses/android-sdk-preview-license
          cat ~/.android/licenses/android-sdk-license
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cp ~/.android/licenses/* $HOME/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
      - name: Build APK
        run: |
          set -euxo pipefail
          buildozer -v android debug
      - uses: actions/upload-artifact@v7
        with:
          name: AirMouse-APK
          path: bin/*.apk